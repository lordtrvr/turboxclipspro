<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — TurboxClipsPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="logo" style="justify-content:center;margin-bottom:16px;">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">Turbox<span class="logo-accent">Clips</span>Pro</span>
      </a>
      <h1>Iniciar sesión</h1>
      <p>Accede a tu cuenta para descargar el programa</p>
    </div>
    <div id="error" class="auth-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Iniciar sesión</button>
    </form>
    <div class="auth-footer">
      ¿No tienes cuenta? <a href="/register">Crear cuenta</a>
    </div>
  </div>
</div>
<script src="/static/js/config.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
