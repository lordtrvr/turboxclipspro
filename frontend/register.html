<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — TurboxClipsPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>
  <div class="auth-card" style="max-width:560px;">
    <div class="auth-header">
      <a href="/" class="logo" style="justify-content:center;margin-bottom:16px;">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">Turbox<span class="logo-accent">Clips</span>Pro</span>
      </a>
      <h1>Crear cuenta</h1>
      <p>Regístrate para descargar el programa</p>
    </div>
    <div id="error" class="auth-error"></div>
    <div id="success" class="auth-success"></div>
    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">Nombre</label>
          <input type="text" id="first_name" name="first_name" required placeholder="Juan">
        </div>
        <div class="form-group">
          <label for="last_name">Apellido</label>
          <input type="text" id="last_name" name="last_name" required placeholder="Pérez">
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="country">País</label>
          <select id="country" name="country" required>
            <option value="">Selecciona tu país</option>
            <option value="México">México</option>
            <option value="España">España</option>
            <option value="Argentina">Argentina</option>
            <option value="Colombia">Colombia</option>
            <option value="Chile">Chile</option>
            <option value="Perú">Perú</option>
            <option value="Venezuela">Venezuela</option>
            <option value="Ecuador">Ecuador</option>
            <option value="Guatemala">Guatemala</option>
            <option value="República Dominicana">República Dominicana</option>
            <option value="Honduras">Honduras</option>
            <option value="El Salvador">El Salvador</option>
            <option value="Nicaragua">Nicaragua</option>
            <option value="Costa Rica">Costa Rica</option>
            <option value="Panamá">Panamá</option>
            <option value="Bolivia">Bolivia</option>
            <option value="Paraguay">Paraguay</option>
            <option value="Uruguay">Uruguay</option>
            <option value="Cuba">Cuba</option>
            <option value="Puerto Rico">Puerto Rico</option>
            <option value="Estados Unidos">Estados Unidos</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="birth_date">Fecha de nacimiento</label>
          <input type="date" id="birth_date" name="birth_date" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Crear cuenta</button>
    </form>
    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
    </div>
  </div>
</div>
<script src="/static/js/config.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
