services:
  - type: web
    name: turboxclipspro-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: TurboxClipsPro <turboxclips@gmail.com>
      - key: APP_NAME
        value: TurboxClipsPro
      - key: APP_URL
        sync: false
      - key: DOWNLOAD_URL
        sync: false
      - key: ADMIN_WHATSAPP
        value: 18293670355
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
