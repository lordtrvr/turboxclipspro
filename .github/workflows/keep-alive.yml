name: Keep Render awake

on:
  schedule:
    # Render free se duerme tras ~15 min sin trafico; este ping lo mantiene listo.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl --fail --silent --show-error --max-time 60 https://turboxclipspro-api.onrender.com/health
